name: Crea APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Prepara il gioco (font offline)
        run: npm run prepare-web

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Icona e schermata di avvio
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#cfdccb' --splashBackgroundColor '#cfdccb'

      - name: Solo verticale, schermo intero
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation\|VIBRATE" android/app/src/main/AndroidManifest.xml

      - name: Sincronizza
        run: npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MucchioDiGatti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MucchioDiGatti-apk
          path: MucchioDiGatti.apk

      - name: Pubblica come release (link diretto per il telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mucchio di Gatti (build ${{ github.run_number }})
          body: Scarica MucchioDiGatti.apk dal telefono e installalo.
          files: MucchioDiGatti.apk
